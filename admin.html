<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nyftaa · Product Admin</title>
<link rel="icon" href="assets/svgviewer-png-output (2).png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f4f6; color: #111827; padding: 24px; }
.maxw { max-width: 1100px; margin: 0 auto; }
h1 { font-size: 22px; margin-bottom: 16px; letter-spacing: -.02em; }
.grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: 13px; }
th { background: #f9fafb; font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: .06em; color: #6b7280; }
img.thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; border: 1px solid #d1d5db; background: #fff; }
code { font-size: 12px; background: #f3f4f6; padding: 1px 4px; border-radius: 3px; color: #111827; }
.btn { border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
.btn-primary { background: #111827; color: #fff; }
.btn-primary:hover { background: #374151; }
.btn-danger { background: #fecaca; color: #991b1b; border: 1px solid #fca5a5; }
.btn-danger:hover { background: #fca5a5; }
.btn-sm { padding: 3px 7px; font-size: 11px; }
.msg { padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; display: none; }
.msg.ok { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
.msg.err { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
.empty { text-align: center; padding: 40px; color: #6b7280; }
form { background: #fff; padding: 18px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); display: grid; gap: 12px; position: sticky; top: 24px; }
label { font-size: 12px; font-weight: 700; color: #374151; }
input, select, textarea { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; }
textarea { resize: vertical; min-height: 56px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.actions { display: flex; gap: 8px; }
.cancel { display: none; background: #e5e7eb; color: #374151; }
.cancel:hover { background: #d1d5db; }
.modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.45); }
.modal-backdrop { position: absolute; inset: 0; }
.modal-card { background: #fff; border-radius: 8px; padding: 24px; min-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,.2); position: relative; z-index: 51; text-align: center; }
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; color: #111827; }
.modal-body { font-size: 14px; color: #374151; margin-bottom: 18px; min-height: 20px; }
.modal-footer { display: flex; justify-content: center; }
@media (max-width: 768px) { .modal-card { min-width: auto; width: 88%; margin: 0 16px; } }
@media (max-width: 768px) { .grid { grid-template-columns: 1fr; } form { position: static; } }
</style>
</head>
<body>
<div class="maxw">
  <h1>Product Admin</h1>
  <div id="msg" class="msg"></div>
  <div class="filterbar" style="margin:12px 0 8px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
    <input type="text" id="searchInput" placeholder="Search code or name…" style="padding:8px 10px; border:1px solid #d1d5db; border-radius:4px; width:260px; font-size:13px;">
    <select id="catFilter" style="padding:8px 10px; border:1px solid #d1d5db; border-radius:4px; font-size:13px;">
      <option value="">All categories</option>
    </select>
    <button class="btn btn-primary" id="clearFilters" style="padding:8px 12px;">Clear filters</button>
    <span id="filterCount" style="font-size:12px; color:#6b7280; margin-left:auto;"></span>
  </div>
  <div id="okModal" class="modal" style="display:none">
    <div class="modal-backdrop" onclick="closeOkModal()"></div>
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-title">Saved</div>
      <div class="modal-body" id="okModalBody">Product updated successfully.</div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="closeOkModal()">OK</button>
      </div>
    </div>
  </div>
  <div id="dupModal" class="modal" style="display:none">
    <div class="modal-backdrop" onclick="closeDupModal()"></div>
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-title">Code Already Exists</div>
      <div class="modal-body" id="dupModalBody"></div>
      <div class="modal-footer" style="justify-content:center; gap:8px">
        <button class="btn btn-danger" onclick="closeDupModal()">Cancel</button>
        <button class="btn btn-primary" style="background:#2F7BF0" onclick="useSuggestedCode()">Use suggested code</button>
        <button class="btn btn-primary" onclick="proceedWithDuplicate()">Save Anyway</button>
      </div>
    </div>
  </div>
  <div class="grid">
    <div>
      <table>
        <thead><tr><th style="width:30px">#</th><th>Image</th><th>Code</th><th>Name</th><th>Cat</th><th>Price (₹)</th><th>Size</th><th>Actions</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <p id="empty" class="empty" style="display:none">No products.</p>
    </div>
    <aside>
      <form id="form">
        <input type="hidden" id="editCode">
        <label>Category</label>
        <select id="cat">
          <option value="furniture">furniture</option>
          <option value="slides">slides</option>
          <option value="rockers">rockers</option>
          <option value="pools">pools</option>
          <option value="playhouses">playhouses</option>
          <option value="classroom_essentials">classroom_essentials</option>
          <option value="other">other</option>
          <option value="boards">boards</option>
          <option value="flooring_games">flooring_games</option>
          <option value="kids_gym">kids_gym</option>
          <option value="outdoor_play">outdoor_play</option>
          <option value="water_sports">water_sports</option>
          <option value="wall_activity">wall_activity</option>
          <option value="soft_play">soft_play</option>
        </select>
        <div class="row">
          <div><label>Product Code</label><input id="code" placeholder="e.g. ABC_001"></div>
          <div><label>Price</label><input id="price" type="number" min="0" step="1"></div>
        </div>
        <label>Name</label><input id="name">
        <label>Size</label><input id="size" placeholder="e.g. 24&quot; × 24&quot; × 20&quot;">
        <label>Notes (comma separated)</label><input id="notes" placeholder="4 colours available, Sturdy">
        <label>Product Image</label><input type="file" id="image" accept="image/*">
        <div class="actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Save Product</button>
          <button type="button" class="btn cancel" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </aside>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let supabaseClient = null;

async function initSupabase() {
  const res = await fetch('/api/config');
  const config = await res.json();
  if (!config.supabaseUrl || !config.supabaseAnonKey) {
    throw new Error('Supabase config not available. Set SUPABASE_URL and SUPABASE_ANON_KEY in Vercel env vars.');
  }
  supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
}

const tbody = document.getElementById('tbody');
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const editCode = document.getElementById('editCode');
const submitBtn = document.getElementById('submitBtn');
const cancelBtn = document.getElementById('cancelBtn');
const empty = document.getElementById('empty');
let currentProduct = null;
const searchInput = document.getElementById('searchInput');
const catFilter = document.getElementById('catFilter');
const clearFilters = document.getElementById('clearFilters');
const filterCount = document.getElementById('filterCount');
let allProducts = [];
let currentSearch = '';
let currentCat = '';

function showMsg(text, kind) {
  msg.textContent = text;
  msg.className = 'msg ' + kind;
  msg.style.display = 'block';
  setTimeout(() => { msg.style.display = 'none'; }, 4000);
}

function closeOkModal() {
  document.getElementById('okModal').style.display = 'none';
}

let allowDuplicate = false;
let suggestedCode = '';

function closeDupModal() {
  document.getElementById('dupModal').style.display = 'none';
  allowDuplicate = false;
  suggestedCode = '';
}

function proceedWithDuplicate() {
  document.getElementById('dupModal').style.display = 'none';
  allowDuplicate = true;
  form.dispatchEvent(new Event('submit', { cancelable: true }));
}

function useSuggestedCode() {
  document.getElementById('code').value = suggestedCode;
  closeDupModal();
}

async function suggestSimilarCode(code) {
  let num = 1;
  let candidate = `${code}_${num}`;
  while (await checkCodeExists(candidate)) {
    num++;
    candidate = `${code}_${num}`;
  }
  return candidate;
}

async function checkCodeExists(code) {
  const res = await fetch(`/api/products?code=${encodeURIComponent(code)}`);
  if (!res.ok) return null;
  const p = await res.json();
  const product = Array.isArray(p) ? p[0] : p;
  return product || null;
}

async function handleDupCheck(code) {
  if (allowDuplicate) return true;
  const existing = await checkCodeExists(code);
  if (!existing) return true;
  const isEditingSame = editCode.value && editCode.value === code;
  if (isEditingSame) return true;
  const similar = await suggestSimilarCode(code);
  suggestedCode = similar;
  const body = `
    <strong>Code:</strong> ${existing.code}<br>
    <strong>Name:</strong> ${existing.name}<br>
    <strong>Category:</strong> ${existing.cat}<br>
    <strong>Price:</strong> ₹${existing.price}
  `;
  document.getElementById('dupModalBody').innerHTML = `
    A product with this code already exists:<br><br>${body}<br><br>
    Suggested similar code: <strong style="color:#2F7BF0">${similar}</strong><br><br>
    Do you want to save anyway?
  `;
  document.getElementById('dupModal').style.display = 'flex';
  return false;
}

function updateRowInTable(product) {
  const idx = allProducts.findIndex(p => p.code === product.code);
  if (idx !== -1) allProducts[idx] = product;
  render();
}

async function load() {
  try {
    const res = await fetch('/api/products');
    const products = await res.json();
    allProducts = products || [];
    buildCatFilter();
    render();
  } catch (err) {
    showMsg('Failed to load products.', 'err');
    console.error(err);
  }
}

function buildCatFilter() {
  const cats = new Set(allProducts.map(p => p.cat).filter(Boolean));
  catFilter.innerHTML = '<option value="">All categories</option>';
  [...cats].sort().forEach(c => {
    const o = document.createElement('option');
    o.value = c;
    o.textContent = c;
    catFilter.appendChild(o);
  });
}

function render() {
  const term = currentSearch.toLowerCase();
  const filtered = allProducts.filter(p => {
    const matchSearch = !term ||
      (p.code && p.code.toLowerCase().includes(term)) ||
      (p.name && p.name.toLowerCase().includes(term));
    const matchCat = !currentCat || p.cat === currentCat;
    return matchSearch && matchCat;
  });

  tbody.innerHTML = '';
  filterCount.textContent = `${filtered.length} of ${allProducts.length} products`;
  if (!filtered.length) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  filtered.forEach((p, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="text-align:center">${i + 1}</td>
      <td><img class="thumb" src="${p.img}" alt=""></td>
      <td><code>${p.code}</code></td>
      <td>${p.name}</td>
      <td>${p.cat}</td>
      <td>${p.price}</td>
      <td>${p.size || '—'}</td>
      <td class="actions">
        <button class="btn btn-sm btn-primary" onclick="app.editProduct('${p.code}')">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="app.deleteProduct('${p.code}')">Delete</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

searchInput.oninput = () => { currentSearch = searchInput.value; render(); };
catFilter.onchange = () => { currentCat = catFilter.value; render(); };
clearFilters.onclick = () => {
  searchInput.value = '';
  catFilter.value = '';
  currentSearch = '';
  currentCat = '';
  render();
};

document.getElementById('code').onblur = async () => {
  const code = document.getElementById('code').value.trim();
  if (!code) return;
  await handleDupCheck(code);
};

async function uploadImage(file) {
  const safeName = file.name.replace(/[^a-zA-Z0-9.\-]/g, '_');
  const fileName = `${Date.now()}-${Math.round(Math.random()*1e9)}${safeName}`;
  const { error } = await supabaseClient.storage
    .from('products')
    .upload(fileName, file, { cacheControl: '3600', upsert: false });
  if (error) throw error;
  const { data } = supabaseClient.storage.from('products').getPublicUrl(fileName);
  return data.publicUrl;
}

window.app = {
  editProduct: async (code) => {
    try {
      const res = await fetch(`/api/products?code=${encodeURIComponent(code)}`);
      const p = await res.json();
      if (!res.ok) throw new Error(p.error || 'Failed to load product');
      const product = Array.isArray(p) ? p[0] : p;
      if (!product) throw new Error('Product not found');
      currentProduct = product;
      editCode.value = product.code;
      document.getElementById('cat').value = product.cat;
      document.getElementById('code').value = product.code;
      document.getElementById('name').value = product.name;
      document.getElementById('size').value = product.size || '';
      document.getElementById('price').value = product.price;
      document.getElementById('notes').value = (product.notes || []).join(', ');
      submitBtn.textContent = 'Update Product';
      cancelBtn.style.display = 'inline-block';
      form.scrollIntoView({ behavior: 'smooth' });
    } catch (err) {
      showMsg(err.message, 'err');
      console.error(err);
    }
  },
  deleteProduct: async (code) => {
    if (!confirm('Delete this product?')) return;
    const res = await fetch(`/api/products?code=${encodeURIComponent(code)}`, { method: 'DELETE' });
    if (!res.ok) { showMsg('Delete failed.', 'err'); return; }
    showMsg('Product deleted.', 'ok');
    load();
  }
};

cancelBtn.onclick = () => {
  form.reset(); editCode.value = ''; currentProduct = null;
  submitBtn.textContent = 'Save Product'; cancelBtn.style.display = 'none';
};

form.onsubmit = async (e) => {
  e.preventDefault();
  const code = document.getElementById('code').value.trim();
  if (!code) { showMsg('Product code is required.', 'err'); return; }
  if (!(await handleDupCheck(code))) return;
  const cat = document.getElementById('cat').value;
  const name = document.getElementById('name').value;
  const size = document.getElementById('size').value;
  const price = document.getElementById('price').value;
  const notes = document.getElementById('notes').value;
  const file = document.getElementById('image').files[0];

  let imgUrl = currentProduct ? currentProduct.img : '';
  if (file) {
    imgUrl = await uploadImage(file);
  }

  const body = {
    cat,
    name,
    size,
    price: Number(price) || 0,
    img: imgUrl,
    notes: notes.split(',').map(s => s.trim()).filter(Boolean)
  };
  const isEdit = !!editCode.value;
  const url = isEdit ? `/api/products?code=${encodeURIComponent(editCode.value)}` : '/api/products';
  body.code = code;

  try {
    let res = await fetch(url, {
      method: isEdit ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (isEdit && res.status === 404) {
      res = await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'failed');
    showMsg(isEdit ? 'Product updated.' : 'Product added.', 'ok');
    const modalBody = document.getElementById('okModalBody');
    modalBody.textContent = isEdit ? 'Product updated successfully.' : 'Product added successfully.';
    document.getElementById('okModal').style.display = 'flex';
    form.reset(); editCode.value = ''; currentProduct = null;
    submitBtn.textContent = 'Save Product'; cancelBtn.style.display = 'none';
    load();
  } catch (err) {
    showMsg(err.message, 'err');
  }
};

initSupabase().then(load).catch(err => {
  showMsg(err.message, 'err');
  console.error(err);
});
</script>
</body>
</html>
